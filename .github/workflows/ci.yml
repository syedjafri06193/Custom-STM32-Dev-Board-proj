name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install pyyaml pytest
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Firmware unit tests, design rules, tool tests
        run: make check
      - name: Firmware unit tests under ASan + UBSan
        run: make -C firmware sanitize
      - name: Cross-compile for the STM32G474RET6
        run: make target
      - name: Bench report
        run: make report
